name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows executable
        run: pyinstaller chesspair.spec

      - name: Calculate checksums
        run: |
          certutil -hashfile dist/ChessPair.exe SHA256 > ChessPair-Windows-SHA256.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessPair-Windows
          path: dist/ChessPair.exe

      - name: Upload Windows checksums
        uses: actions/upload-artifact@v4
        with:
          name: ChessPair-Windows-SHA256
          path: ChessPair-Windows-SHA256.txt

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Convert PNG to ICNS if needed
        run: |
          if [ ! -f assets/icon.icns ] && [ -f assets/icon-512.png ]; then
            mkdir -p assets/icon.iconset
            cp assets/icon-512.png assets/icon.iconset/icon_512x512.png
            iconutil -c icns assets/icon.iconset -o assets/icon.icns
            rm -rf assets/icon.iconset
            echo "Converted icon-512.png to icon.icns"
          fi

      - name: Build macOS app bundle
        run: pyinstaller chesspair.spec

      - name: Create DMG
        run: |
          hdiutil create -volname "ChessPair" \
            -srcfolder dist/ChessPair.app \
            -ov -format UDZO \
            -imagekey zlib-level=9 \
            ChessPair.dmg

      - name: Calculate checksums
        run: |
          shasum -a 256 ChessPair.dmg > ChessPair-macOS-SHA256.txt

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessPair-macOS
          path: ChessPair.dmg

      - name: Upload macOS checksums
        uses: actions/upload-artifact@v4
        with:
          name: ChessPair-macOS-SHA256
          path: ChessPair-macOS-SHA256.txt

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/ChessPair-Windows/ChessPair.exe release/
          cp artifacts/ChessPair-macOS/ChessPair.dmg release/
          cp artifacts/ChessPair-Windows-SHA256/ChessPair-Windows-SHA256.txt release/
          cp artifacts/ChessPair-macOS-SHA256/ChessPair-macOS-SHA256.txt release/
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
